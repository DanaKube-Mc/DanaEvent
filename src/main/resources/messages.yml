# Préfixe global utilisé dans les messages
prefix: "<gradient:#00c6ff:#0072ff><b>DanaEvent</b></gradient> <dark_gray>»</dark_gray>"

# Messages globaux et erreurs de commandes
no-permission: "<prefix> <red>Vous n'avez pas la permission d'exécuter cette commande.</red>"
