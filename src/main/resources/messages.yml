team-invite-received: "<prefix> <yellow><player></yellow> vous a invité à rejoindre l'équipe <team> ! <click:run_command:'/de team accept <team_id>'><green><b>[ACCEPTER]</b></green></click> <click:run_command:'/de team decline <team_id>'><red><b>[REFUSER]</b></red></click>"
team-invite-accepted: "<prefix> <green><player> a rejoint l'équipe !</green>"
team-invite-declined: "<prefix> <red><player> a refusé l'invitation de l'équipe.</red>"
team-invite-expired: "<prefix> <red>Cette invitation a expiré.</red>"
team-invite-not-found: "<prefix> <red>Aucune invitation en attente pour cette équipe.</red>"
team-kicked: "<prefix> <red>Vous avez été expulsé de l'équipe <team>.</red>"
team-member-kicked: "<prefix> <yellow><player></yellow> a été expulsé de l'équipe."
team-left: "<prefix> <gray>Vous avez quitté l'équipe <team>.</gray>"
team-member-left: "<prefix> <yellow><player></yellow> a quitté l'équipe."
team-leader-left-disbanded: "<prefix> <red>Le chef d'équipe a quitté l'équipe, elle a donc été dissoute.</red>"
team-not-found: "<prefix> <red>L'équipe demandée est introuvable.</red>"
team-id-invalid: "<prefix> <red>L'identifiant d'équipe est invalide (3 à 32 caractères alphanumériques et tirets).</red>"
team-id-taken: "<prefix> <red>Une équipe avec cet identifiant existe déjà.</red>"
team-friendly-fire: "<prefix> <red>Vous ne pouvez pas blesser votre coéquipier <yellow><player></yellow> !</red>"
team-no-colors-available: "<prefix> <red>Toutes les 16 couleurs d'équipes sont actuellement occupées.</red>"
team-player-not-found: "<prefix> <red>Le joueur <yellow><player></yellow> est introuvable ou hors-ligne.</red>"
team-admin-disbanded: "<prefix> <green>L'équipe <yellow><team></yellow> a été dissoute de force.</green>"
team-admin-color-changed: "<prefix> <green>La couleur de l'équipe <yellow><team></yellow> a été changée en <color>.</green>"
team-admin-points-added: "<prefix> <green><amount> points ont été attribués à l'équipe <yellow><team></yellow> (<event>).</green>"
team-invalid-amount: "<prefix> <red>Montant de points invalide.</red>"
team-color-invalid: "<prefix> <red>Couleur inconnue. Choisissez parmi les 16 couleurs Minecraft officielles.</red>"
