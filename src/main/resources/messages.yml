team-color-taken: "<prefix> <red>La couleur <color> est déjà utilisée par une autre équipe.</red>"
team-already-in-team: "<prefix> <red>Vous faites déjà partie d'une équipe (<team>).</red>"
team-not-in-team: "<prefix> <red>Vous ne faites partie d'aucune équipe.</red>"
