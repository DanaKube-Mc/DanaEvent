# ==============================================================================
#                      DanaEvent - Configuration des Messages
# ==============================================================================
# Charte graphique : Modern DanaKube Palette (<gradient:#00c6ff:#0072ff>)
# Format : Kyori Adventure MiniMessage (https://docs.advntr.dev/minimessage/format.html)
# ==============================================================================

# Préfixe global utilisé dans les messages
prefix: "<gradient:#00c6ff:#0072ff><b>DanaEvent</b></gradient> <dark_gray>»</dark_gray>"

# Messages globaux et erreurs de commandes
no-permission: "<prefix> <red>Vous n'avez pas la permission d'exécuter cette commande.</red>"
player-only: "<prefix> <red>Cette commande ne peut être exécutée que par un joueur.</red>"
reload-success: "<prefix> <green>Configuration et messages rechargés avec succès !</green>"
module-not-found: "<prefix> <red>Le module <yellow><module></yellow> est introuvable.</red>"
module-disabled: "<prefix> <red>Le module <yellow><module></yellow> est actuellement désactivé.</red>"
command-unknown: "<prefix> <red>Sous-commande inconnue. Utilisez <yellow>/de help</yellow> pour afficher l'aide.</red>"
error-generic: "<prefix> <red>Une erreur est survenue lors de l'exécution.</red>"

# État des joueurs et récupération d'urgence (Crash recovery)
crash-recovery-restored: "<prefix> <green>Votre inventaire et votre état ont été restaurés avec succès après une interruption.</green>"

# Outil de Sélection (Wand)
wand-given: "<prefix> <green>Vous avez reçu le bâton de sélection !</green>"
wand-pos1-set: "<prefix> <green>Position 1 définie en <yellow><x>, <y>, <z></yellow> (<aqua><world></aqua>).</green>"
wand-pos2-set: "<prefix> <green>Position 2 définie en <yellow><x>, <y>, <z></yellow> (<aqua><world></aqua>).</green>"
wand-volume: "<prefix> <gray>Zone sélectionnée : <yellow><volume></yellow> blocs (<white><width_x>x<height_y>x<width_z></white>).</gray>"

# Module BoatRace
boatrace-start: "<prefix> <green>C'est parti ! Foncez vers la ligne d'arrivée !</green>"
boatrace-lap: "<prefix> <green>Tour <yellow><lap></yellow>/<yellow><total_laps></yellow> complété en <aqua><time></aqua> !</green>"
boatrace-finish: "<prefix> <gold>Course terminée !</gold> Temps final : <yellow><time></yellow> !"
boatrace-respawn-start: "<prefix> <yellow>Retour au départ de la course !</yellow>"
boatrace-anti-cut: "<prefix> <red><b>Anti-Cut !</b> Vous avez quitté votre bateau, votre course est annulée !</red>"
boatrace-cancelled: "<prefix> <red>Course annulée : <yellow><reason></yellow></red>"
event-not-in-event: "<prefix> <red>Vous ne participez actuellement à aucun événement.</red>"
event-leave-success: "<prefix> <green>Vous avez quitté l'événement avec succès.</green>"
boatrace-no-tracks: "<prefix> <gray>Aucun circuit disponible pour le moment.</gray>"
boatrace-track-not-found: "<prefix> <red>Le circuit <yellow><track></yellow> est introuvable.</red>"
boatrace-track-not-ready: "<prefix> <red>Le circuit <yellow><track></yellow> n'est pas encore prêt (configuration incomplète).</red>"
boatrace-already-racing: "<prefix> <red>Vous êtes déjà en pleine course !</red>"
boatrace-not-racing: "<prefix> <red>Vous n'êtes actuellement dans aucune course.</red>"
boatrace-admin-track-created: "<prefix> <green>Circuit <yellow><track></yellow> (<aqua><type></aqua>, <gray><mode></gray>) créé avec succès !</green>"
boatrace-admin-track-exists: "<prefix> <red>Un circuit avec l'identifiant <yellow><track></yellow> existe déjà.</red>"
boatrace-admin-no-selection: "<prefix> <red>Vous devez d'abord définir une sélection complète avec le bâton (/de wand).</red>"
boatrace-admin-start-set: "<prefix> <green>Ligne de départ définie pour le circuit <yellow><track></yellow> !</green>"
boatrace-admin-finish-set: "<prefix> <green>Ligne d'arrivée définie pour le circuit <yellow><track></yellow> !</green>"
boatrace-admin-spawn-added: "<prefix> <green>Point de spawn ajouté pour le circuit <yellow><track></yellow> (Total : <count>).</green>"
boatrace-admin-laps-set: "<prefix> <green>Nombre de tours défini à <yellow><laps></yellow> pour le circuit <yellow><track></yellow>.</green>"
boatrace-admin-collision-toggled: "<prefix> <gray>Collisions <status> pour le circuit <yellow><track></yellow>.</gray>"
boatrace-admin-event-started: "<prefix> <green>Événement lancé sur le circuit <yellow><track></yellow> !</green>"
boatrace-admin-event-stopped: "<prefix> <red>Événement arrêté sur le circuit <yellow><track></yellow>.</red>"
boatrace-admin-ranking-reset: "<prefix> <green>Classement réinitialisé pour le circuit <yellow><track></yellow> (<period>). <deleted> enregistrements supprimés.</green>"

# Cosmétiques et Choix du Bateau
boatrace-boat-selected: "<prefix> <green>Vous avez sélectionné le bateau <yellow><boat></yellow> !</green>"
boatrace-boat-locked: "<prefix> <red>Ce bateau est verrouillé. Vous n'avez pas la permission requise.</red>"
boatrace-boat-gui-title: "<gradient:#00c6ff:#0072ff><b>Choix du Bateau</b></gradient>"

# Affichage du Chrono (HUD)
boatrace-hud-current: "<prefix> <gray>Votre affichage du chrono actuel : <aqua><hud_type></aqua>. Utilisez <yellow>/de br hud <bossbar|actionbar|both></yellow> pour changer.</gray>"
boatrace-hud-updated: "<prefix> <green>Votre affichage du chrono a été réglé sur : <aqua><hud_type></aqua>.</green>"
boatrace-hud-invalid: "<prefix> <red>Mode d'affichage invalide. Choisissez parmi : <yellow>bossbar</yellow>, <yellow>actionbar</yellow>, ou <yellow>both</yellow>.</red>"



